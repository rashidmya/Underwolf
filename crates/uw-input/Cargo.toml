[package]
name = "uw-input"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
portable-atomic = "=1.15.0"
uw-pipe-proto = { path = "../uw-pipe-proto" }

[target.'cfg(windows)'.dependencies]
minhook = "=0.9.0"
windows-sys = { version = "0.61.2", features = [
 "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input",
 "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
 "Win32_System_Threading", "Win32_System_SystemInformation",
 "Win32_Devices_HumanInterfaceDevice",
] }
