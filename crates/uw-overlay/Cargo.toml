[package]
name = "uw-overlay"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
[lib]
name = "uw_overlay"
crate-type = ["lib", "cdylib"]
[dependencies]
uw-input = { path = "../uw-input" }
uw-game-channel = { path = "../uw-game-channel" }
uw-pipe-proto = { path = "../uw-pipe-proto" }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
