[package]
name = "uw-spike-input"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# `lib` for the tested core (used by the Vulkan layer) and integration tests; `cdylib` for the
# injectable PE hook DLL built with `--target x86_64-pc-windows-gnu` for Proton (candidate C3).
[lib]
name = "uw_spike_input"
crate-type = ["lib", "cdylib"]

[dependencies]
uw-spike-ipc = { path = "../ipc" }

# H1 (XInput2 hotkey) and C2 (winex11.so filter) are Linux/X11 only.
[target.'cfg(unix)'.dependencies]
x11rb = { version = "0.13", features = ["xinput"] }
libc = "0.2"

# C3's in-process Win32 hook. Built for x86_64-pc-windows-gnu and loaded into the game under Proton.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics_Debug",
] }
