[package]
name = "uw-spike-dlcollector"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# `lib` for the portable, unit-tested core; `cdylib` for the in-game plugin DLL built with
# `--target x86_64-pc-windows-gnu` (the plugin entry points arrive in later tasks).
[lib]
name = "uw_spike_dlcollector"
crate-type = ["lib", "cdylib"]

[dependencies]
uw-spike-gep-channel = { path = "../gep-channel" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
] }
