[package]
name = "uw-spike-ipc"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "uw_spike_ipc"

[dependencies]
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }

# The Unix-socket transport (SCM_RIGHTS fd passing) is Linux-only. The C3 Win32 hook builds this
# crate for x86_64-pc-windows-gnu and uses only the portable `write_msg`/`read_msg` over TCP.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["net", "time"] }  # "time": rustix 1.1.5 fails to build with "net" alone
