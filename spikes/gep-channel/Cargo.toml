[package]
name = "uw-spike-gep-channel"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "uw_spike_gep_channel"

# Named shared memory, mutexes and events (`win.rs`). Built for x86_64-pc-windows-gnu by the in-game
# collector (producer) and the Wine-side helper (consumer).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
