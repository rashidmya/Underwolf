<!doctype html>
<html><head><style>
  html, body { margin: 0; height: 100%; background: transparent; font: 600 18px system-ui, sans-serif; color: #fff; }
  .card { position: absolute; inset: 0; border-radius: 12px; background: rgba(15, 20, 35, 0.75); padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
  button { font: inherit; width: 120px; height: 40px; border-radius: 8px; border: 0; background: #3b82f6; color: #fff; }
  input { font: inherit; height: 36px; border-radius: 6px; border: 2px solid #3b82f6; background: #0b1220; color: #fff; padding: 0 8px; }
</style></head>
<body><div class="card">
  <div><button id="b">Click me</button> &nbsp; clicks: <span id="n">0</span></div>
  <input id="t" placeholder="type here">
</div>
<script>
  let n = 0;
  document.getElementById('b').addEventListener('click', () => { document.getElementById('n').textContent = ++n; });
</script></body></html>
