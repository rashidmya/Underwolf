<!doctype html>
<meta charset="utf-8"><title>Matched idle input fixture</title>
<style>
body{margin:0;background:transparent;color:#e7edf6;font:15px system-ui}
header{position:absolute;left:12px;top:10px;background:#132232ed;padding:12px;border-radius:8px}
article{position:absolute;box-sizing:border-box;width:340px;height:240px;padding:16px;background:#132232f5;border:2px solid #527b98;border-radius:10px}
#one{left:100px;top:100px}#two{left:360px;top:260px}h2{font-size:18px;margin:0 0 8px}
</style>
<header>Matched idle input fixture · Standard</header>
<article id="one"><h2>Widget 1 · block</h2><p>Keys: —</p><p>Buttons: —</p><p>Wheel: 0, 0</p><p>Text:</p></article>
<article id="two"><h2>Widget 2 · notify</h2><p>Keys: —</p><p>Buttons: —</p><p>Wheel: 0, 0</p><p>Text:</p></article>
<script>
window.underwolfGeneration=0;
window.idleConsumption={states:0,tables:0,resets:0};
window.consumeIdle=event=>{
 if(event.type==='state'){
  if(event.state.exclusive||event.state.active)throw Error('idle renderer received active capture');
  window.idleConsumption.states++;window.idleConsumption.epoch=String(event.state.epoch);
 }else if(event.type==='table'){
  window.idleConsumption.tables++;window.idleConsumption.revision=event.config.revision;
 }else if(event.type==='reset')window.idleConsumption.resets++;
 else if(event.type==='record'||event.type==='records')throw Error('input activity invalidates idle sample');
};
</script>
